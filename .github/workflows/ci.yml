name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Installer Chromium Playwright (deps apt en best-effort, jamais bloquant)
        run: |
          npx playwright install chromium
          timeout 120 npx playwright install --with-deps chromium \
            || echo "deps apt indisponibles (miroirs Ubuntu injoignables) : les libs requises sont déjà présentes sur ubuntu-latest, on continue sans"
      - run: npx playwright test --pass-with-no-tests
