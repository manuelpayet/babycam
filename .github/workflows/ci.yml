name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Installer Chromium Playwright (retries sur les deps apt, fallback navigateur seul)
        run: |
          npx playwright install chromium
          for i in 1 2 3; do
            sudo apt-get update || true
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "tentative $i/3 --with-deps en échec, retry dans 20s"
            sleep 20
          done
          echo "fallback : navigateur Playwright seul, sans deps apt"
          npx playwright install chromium
      - run: npx playwright test --pass-with-no-tests
